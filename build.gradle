plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    // The published artifact keeps the modId-safe archive name while the
    // in-game display name is set separately in gradle.properties.
    archivesName = project.findProperty('mod_archive_name') ?: mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    flatDir { dirs 'libs' }
    // Only needed for the unit-test libraries (JUnit 5); the mod itself builds
    // entirely from ./libs and needs no repository access.
    mavenCentral()
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = file('run/client')
            // Override with -PcomsPort=25599 to run several instances side by side.
            jvmArguments.add("-Dcc_virtual_coms.port=${project.findProperty('comsPort') ?: '25585'}")
            // Development-only helpers used by the automated camera smoke test:
            //   -PclientArgs="--username DevCam --server 127.0.0.1 --port 25565"
            //   -PcameraAutotest=true   (enables the scripted GUI/capture test)
            if (project.hasProperty('clientArgs')) {
                programArguments.addAll(
                        project.property('clientArgs').toString().trim().split('\\s+').toList())
            }
            if (project.hasProperty('cameraAutotest')) {
                jvmArguments.add("-Dcc_virtual_coms.autotest=1")
            }
        }
        server {
            server()
            gameDirectory = file('run/server')
            jvmArguments.add("-Dcc_virtual_coms.port=${project.findProperty('comsPort') ?: '25585'}")
        }
        data {
            data()
            gameDirectory = file('run/data')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // JUnit 5 tests run through NeoForge's own test harness so that tests may
    // touch Minecraft classes (ItemStack, CompoundTag, ...) without starting a
    // full client or server. The harness libraries are fetched once and cached.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // ------------------------------------------------------------------
    // Compile-time API dependencies.
    //
    // Every jar below is a *required* runtime prerequisite of this mod and
    // is declared as such in META-INF/neoforge.mods.toml.  They are supplied
    // from the local ./libs directory so that the build is reproducible
    // offline; none of them are bundled into the produced jar.
    // ------------------------------------------------------------------
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Unit tests (see neoForge.unitTest above). Only used by `gradlew test`.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// Expand gradle.properties values into neoforge.mods.toml.
tasks.named('processResources', ProcessResources).configure {
    def expandProps = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]

    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Discover JUnit 5 tests. Without this, Gradle's default JUnit 4 detector finds none of the
// Jupiter test classes and `gradlew test` silently reports "0 tests".
tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// ---------------------------------------------------------------------------
// Optional native DirectShow virtual camera filter.
//
// Only built when native/virtual_camera/build.ps1 can find Visual Studio 2022
// and the Windows SDK; otherwise the script exits 0 and the jar simply ships
// without the DLL, leaving the MJPEG HTTP fallback as the only camera output.
// The DLL lives under build/ and is therefore never committed to git.
// ---------------------------------------------------------------------------
def nativeFilterDir = layout.projectDirectory.dir('native/virtual_camera')
def nativeFilterBuildDir = new File(rootDir, '.build/native')
def nativeFilterStagingDir = layout.buildDirectory.dir('generated/native-resources')

def buildNativeFilter = tasks.register('buildNativeFilter', Exec) {
    group = 'build'
    description = 'Builds the optional x64 DirectShow virtual camera DLL.'
    onlyIf { org.gradle.internal.os.OperatingSystem.current().windows }
    workingDir rootDir
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', nativeFilterDir.file('build.ps1').asFile.absolutePath
}

def nativeDllFile = new File(nativeFilterBuildDir, 'synaxis_cam_filter.dll')

def stageNativeFilter = tasks.register('stageNativeFilter', Copy) {
    description = 'Stages the built native filter DLL as a mod resource.'
    dependsOn buildNativeFilter
    from(nativeDllFile)
    // NativeLibraryLocator looks this up as /native/synaxis_cam_filter.dll inside the jar.
    into(layout.buildDirectory.dir('generated/native-resources/native'))
    onlyIf { nativeDllFile.exists() }
}

sourceSets.main.resources.srcDir(nativeFilterStagingDir)
tasks.named('processResources') { dependsOn stageNativeFilter }
